# Render Blueprint: web app + 15-minute delivery-guarantee cron + Postgres.
# Set the env vars marked sync:false in the Render dashboard after the first deploy.
databases:
  - name: plans-db
    plan: basic-256mb

services:
  - type: web
    name: plans-web
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi --workers 2 --timeout 180
    envVars: &env
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase: { name: plans-db, property: connectionString }
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: USE_S3
        value: "true"
      - key: DASHBOARD_KEY            # dashboard address: /d/<this>/
        generateValue: true
      - { key: SITE_URL, sync: false }            # https://plans.yourfirm.com
      - { key: ALLOWED_HOSTS, sync: false }       # plans.yourfirm.com
      - { key: STRIPE_SECRET_KEY, sync: false }
      - { key: STRIPE_WEBHOOK_SECRET, sync: false }
      - { key: EMAIL_HOST_PASSWORD, sync: false }
      - { key: DEFAULT_FROM_EMAIL, sync: false }
      - { key: ENGINEER_NOTIFY_EMAIL, sync: false }
      - { key: S3_BUCKET, sync: false }
      - { key: S3_ENDPOINT_URL, sync: false }
      - { key: S3_ACCESS_KEY_ID, sync: false }
      - { key: S3_SECRET_ACCESS_KEY, sync: false }

  - type: cron
    name: plans-delivery-guarantee
    runtime: python
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py check_deliveries
    envVars: *env

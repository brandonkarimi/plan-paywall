<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  {% block head %}{% endblock %}
  <title>{% block title %}Plans{% endblock %}</title>
  <style>
    :root {
      --bg: #f5f6f8; --card: #ffffff; --text: #16191d; --muted: #5d6670; --line: #dde1e6;
      --accent: #1d4ed8; --accent-text: #ffffff; --ok: #15803d; --ok-bg: #e8f6ee; --warn: #b45309; --warn-bg: #fdf3e3;
      --err: #b91c1c; --err-bg: #fdeaea; --code-bg: #eef1f4;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1215; --card: #181c21; --text: #e8ebee; --muted: #9aa4ae; --line: #2a3038;
        --accent: #6b8ff0; --accent-text: #0b0d10; --ok: #4ade80; --ok-bg: #12261a; --warn: #fbbf24; --warn-bg: #2a2110;
        --err: #f87171; --err-bg: #2b1414; --code-bg: #20262d; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .wrap { max-width: 920px; margin: 0 auto; padding: 24px 16px 48px; }
    header.firm { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: baseline;
      padding-bottom: 16px; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
    header.firm h1 { font-size: 1.25rem; margin: 0; }
    .muted { color: var(--muted); }
    .small { font-size: .875rem; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; margin-bottom: 18px; }
    .card h2 { font-size: 1.05rem; margin: 0 0 12px; }
    .pill { display: inline-block; font-size: .8rem; font-weight: 600; padding: 2px 10px; border-radius: 999px;
      background: var(--code-bg); color: var(--muted); }
    .pill.ok { background: var(--ok-bg); color: var(--ok); }
    .pill.warn { background: var(--warn-bg); color: var(--warn); }
    .pill.err { background: var(--err-bg); color: var(--err); }
    .btn { display: inline-block; border: 0; cursor: pointer; text-decoration: none; font: inherit; font-weight: 600;
      background: var(--accent); color: var(--accent-text); padding: 12px 22px; border-radius: 8px; }
    .btn.secondary { background: transparent; color: var(--accent); border: 1px solid var(--line); padding: 8px 14px; font-weight: 500; }
    .price { font-size: 1.9rem; font-weight: 700; }
    .notice { border-radius: 8px; padding: 12px 14px; margin-bottom: 18px; }
    .notice.ok { background: var(--ok-bg); color: var(--ok); }
    .notice.warn { background: var(--warn-bg); color: var(--warn); }
    .notice.err { background: var(--err-bg); color: var(--err); }
    code, .hash { font-family: ui-monospace, Consolas, monospace; background: var(--code-bg); padding: 2px 6px;
      border-radius: 4px; font-size: .82rem; word-break: break-all; }
    dl.grid { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
    dl.grid dt { color: var(--muted); }
    dl.grid dd { margin: 0; min-width: 0; }
    ol.sheets { margin: 8px 0 0; padding-left: 1.4em; columns: 2 220px; }
    iframe.preview { width: 100%; height: 70vh; min-height: 420px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    ul.checks { list-style: none; padding: 0; margin: 0; }
    ul.checks li { padding-left: 1.6em; position: relative; margin: 6px 0; }
    ul.checks li::before { content: "✓"; position: absolute; left: 0; color: var(--ok); font-weight: 700; }
    .row { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
    footer { margin-top: 28px; color: var(--muted); font-size: .875rem; }
    a { color: var(--accent); }
    @media (max-width: 560px) { dl.grid { grid-template-columns: 1fr; } dl.grid dt { margin-top: 6px; } }
  </style>
</head>
<body>
  <div class="wrap">{% block content %}{% endblock %}</div>
</body>
</html>
